name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crear proyecto Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html www/index.html
          npx cap init "Sbc.select" com.sbc.select --web-dir www
          npx cap add android
      - name: Icono y pantalla de inicio con el logo
        continue-on-error: true
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0a0c' --splashBackgroundColor '#0a0a0c'
      - name: Sincronizar y compilar APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          gh release create v1 app.apk --title "APK" --notes "APK de depuración"
