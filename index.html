<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Sbc.select | Perfumes</title>
<style>
:root{--black:#0a0a0c;--ink:#111216;--graphite:#1a1c22;--steel:#2b2e36;--gray:#8b8f99;--silver:#c7cad1;--gold:#c9a24b;--gold2:#e3c878;--royal:#1d3fcf;--royal2:#3258f0;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:90px}
body{background:var(--black);color:var(--silver);min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
button{cursor:pointer;font:inherit;border-radius:0}
.lg{width:44px;height:44px;flex:none}
header{position:sticky;top:0;z-index:20;background:var(--black);border-bottom:1px solid var(--steel);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--royal))}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--serif);font-size:1.3rem;letter-spacing:.32em;color:#fff;display:block;line-height:1}
.brand small{font-size:.62rem;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
.search{flex:1;min-width:170px;max-width:380px;margin-left:auto}
.search input{width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--steel);background:transparent;color:#fff;outline:none;font-size:.9rem;border-radius:0}
.search input:focus{border-color:var(--gold)}
.cartbtn{background:transparent;color:var(--gold);border:1px solid var(--gold);padding:10px 16px;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;display:flex;gap:10px;align-items:center}
.cartbtn:hover{background:var(--gold);color:var(--black)}
.cartbtn i{font-style:normal;background:var(--royal);color:#fff;min-width:20px;padding:1px 6px;font-size:.72rem;text-align:center}
main{max-width:1240px;margin:0 auto;padding:0 20px 80px}
.hero{margin:0 -20px 28px;padding:56px 20px 48px;background:radial-gradient(900px 300px at 85% 0,rgba(29,63,207,.35),transparent 70%),linear-gradient(180deg,var(--ink),var(--black));border-bottom:1px solid var(--steel);text-align:center}
.hero .k{font-size:.72rem;letter-spacing:.45em;color:var(--gold);text-transform:uppercase}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(1.8rem,5vw,3.2rem);letter-spacing:.08em;text-transform:uppercase;color:#fff;margin:14px 0}
.hero .rule{width:70px;height:2px;background:var(--gold);margin:0 auto 14px}
.hero p{color:var(--gray);max-width:540px;margin:0 auto;font-size:.95rem;line-height:1.6}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-bottom:1px solid var(--steel);margin-bottom:24px}
.tabs{display:flex;gap:22px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--gray);padding:12px 0;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.tab:hover{color:#fff}.tab.on{color:var(--gold);border-color:var(--gold)}
select{background:var(--ink);color:var(--silver);border:1px solid var(--steel);padding:8px 10px;font-size:.8rem;border-radius:0;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--ink);border:1px solid var(--steel);border-radius:2px;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.art{height:270px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2d38,var(--graphite) 70%);border-bottom:1px solid var(--steel);overflow:hidden}
.art img{width:100%;height:100%;object-fit:contain;padding:14px;background:#fff0}
.art svg{height:72%}
.tag{position:absolute;top:12px;left:12px;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:3px 8px;background:rgba(10,10,12,.7)}
.body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-family:var(--serif);font-weight:400;font-size:1.02rem;line-height:1.35;color:#fff}
.notes{color:var(--gray);font-size:.82rem;line-height:1.5;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--steel);padding-top:12px}
.price{font-family:var(--serif);color:var(--gold2);font-size:1.2rem}
.add{background:var(--gold);color:var(--black);border:0;padding:10px 14px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.add:hover{background:var(--royal);color:#fff}
.empty{color:var(--gray);text-align:center;padding:40px 10px;grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:-440px;width:min(420px,94vw);height:100%;background:var(--ink);border-left:2px solid var(--gold);z-index:50;display:flex;flex-direction:column;transition:right .25s;padding-top:env(safe-area-inset-top,0px)}
.panel.open{right:0}
.ph{padding:16px 18px;border-bottom:1px solid var(--steel);display:flex;justify-content:space-between;align-items:center}
.ph h2{font-family:var(--serif);font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:1rem;color:#fff}
.ph button{background:none;border:0;color:var(--silver);font-size:1.6rem}
.items{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--graphite);border:1px solid var(--steel);padding:10px}
.mini{width:52px;height:60px;display:grid;place-items:center;background:var(--black);flex:none}
.mini img{width:100%;height:100%;object-fit:contain}.mini svg{height:90%}
.info{flex:1;min-width:0}.info p{font-size:.85rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{color:var(--gold2)}
.qty{display:flex;align-items:center;gap:8px;color:#fff;font-size:.85rem}
.qty button{width:26px;height:26px;border:1px solid var(--steel);background:var(--ink);color:var(--silver)}
.qty button:hover{border-color:var(--gold);color:var(--gold)}
.rm{background:none;border:0;color:var(--gray);font-size:1.1rem}.rm:hover{color:#ff6b6b}
.pf{padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--steel)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;color:var(--gray);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
.total b{font-family:var(--serif);font-size:1.4rem;color:var(--gold2);letter-spacing:0}
.btn{width:100%;background:var(--royal);color:#fff;border:0;padding:14px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.btn:hover{background:var(--royal2)}
.btn.ghost{background:transparent;border:1px solid var(--steel);color:var(--silver);margin-top:8px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,94vw);max-height:88vh;background:var(--ink);border:1px solid var(--gold);z-index:60;display:none;flex-direction:column}
.modal.open{display:flex}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:#fff}
.arow input,.fld input{width:110px;padding:8px;border:1px solid var(--steel);background:var(--black);color:#fff;border-radius:0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--gray)}.fld input{width:100%}
.sec{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:8px}
footer{border-top:1px solid var(--steel);text-align:center;color:var(--gray);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;padding:26px 16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--gold);color:var(--black);padding:11px 20px;font-size:.78rem;letter-spacing:.08em;opacity:0;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="logo" viewBox="0 0 120 120">
<rect x="3" y="3" width="114" height="114" fill="#0a0a0c" stroke="#c9a24b" stroke-width="3"/>
<rect x="11" y="11" width="98" height="98" fill="none" stroke="#1d3fcf" stroke-width="1.5"/>
<polygon points="60,18 102,60 60,102 18,60" fill="none" stroke="#c9a24b" stroke-width="2"/>
<polygon points="60,28 92,60 60,92 28,60" fill="#141828" stroke="#1d3fcf" stroke-width="1.2"/>
<text x="60" y="65" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="19" fill="#e3c878" letter-spacing="1">SBC</text>
<rect x="46" y="72" width="28" height="1.6" fill="#3258f0"/>
</symbol></defs></svg>

<header>
  <div class="brand"><svg class="lg"><use href="#logo"/></svg><div><b>SBC</b><small>.select</small></div></div>
  <div class="search"><input id="q" type="search" placeholder="Buscar perfume o nota" aria-label="Buscar"></div>
  <button class="cartbtn" id="openCart">Carrito <i id="count">0</i></button>
</header>

<main>
  <section class="hero">
    <div class="k">Colección masculina</div>
    <h1>Fragancias de autor</h1>
    <div class="rule"></div>
    <p>Una selección cuidada de perfumes para hombre. Elige tu estilo, agrega a tu carrito y consulta tu total.</p>
  </section>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <select id="sort" aria-label="Ordenar">
      <option value="def">Destacados</option>
      <option value="asc">Precio: menor a mayor</option>
      <option value="desc">Precio: mayor a menor</option>
    </select>
  </div>
  <section class="grid" id="grid"></section>
</main>
<footer>Sbc.select · Perfumes</footer>

<div class="overlay" id="overlay"></div>
<aside class="panel" id="panel" aria-label="Carrito">
  <div class="ph"><h2>Tu carrito</h2><button id="closeCart" aria-label="Cerrar">×</button></div>
  <div class="items" id="items"></div>
  <div class="pf"><div class="total"><span>Total</span><b id="total">$0</b></div><button class="btn" id="checkout">Finalizar compra</button></div>
</aside>
<div class="overlay" id="aOverlay" style="z-index:55"></div>
<section class="modal" id="adminPanel" aria-label="Ajustes"></section>
<div class="toast" id="toast"></div>

<script>
const products=[
{id:1,name:"Jean Paul Gaultier Le Male Le Parfum",cat:"Dulce",notes:"Cardamomo, lavanda, vainilla y madera. Aroma intenso y elegante.",price:1899,c:["#1e3a8a","#0b1437"]},
{id:2,name:"Versace Eros Pour Homme",cat:"Fresco",notes:"Menta, manzana verde, vainilla y maderas. Fresco y seductor.",price:1599,c:["#2bb3c9","#0e5f78"]},
{id:3,name:"Afnan 9 PM",cat:"Dulce",notes:"Canela, lavanda, vainilla y tonka. Dulce, nocturno y potente.",price:899,c:["#6d28d9","#2e1065"]},
{id:4,name:"Valentino Born in Roma Coral Fantasy",cat:"Fresco",notes:"Manzana roja, bergamota, lavanda y cuero. Moderno y vibrante.",price:2199,c:["#f0786b","#b3362b"]},
{id:5,name:"Jean Paul Gaultier Scandal Pour Homme",cat:"Amaderado",notes:"Miel, tabaco, haba tonka y vetiver. Dulce, amaderado y llamativo.",price:1799,c:["#d9a441","#7a4a0c"]},
{id:6,name:"Lattafa Asad",cat:"Amaderado",notes:"Piña, tabaco, canela y vainilla. Inspiración intensa y especiada.",price:699,c:["#4b5563","#111827"]},
{id:7,name:"Mandaryn Sky Elixir",cat:"Fresco",notes:"Mandarina, notas dulces y amaderadas. Fresco con fondo cálido.",price:799,c:["#fb923c","#c2410c"]}
];
const ADMIN_CODE="sbc-admin";
const $=id=>document.getElementById(id);
const fmt=v=>"$"+v.toLocaleString("es-MX");
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cart=ls.get("sbc-cart",[]).filter(i=>products.some(p=>p.id===i.id));
let cat="Todos",sort="def",term="";
const prices=ls.get("sbc-prices",{});
products.forEach(p=>{p.base=p.price;const o=Math.round(+prices[p.id]);if(o>0)p.price=o});
let G=ls.get("sbc-google",{key:"",cx:""});   // API key y CX de Google (también se editan en el panel sbc-admin)
const OK={};                                   // imagen que cargó bien, por producto

/* ---------- Imágenes de Google (Custom Search API, búsqueda de imágenes) ---------- */
const TRIED={};
async function imageLinks(p){
  const ck="sbc-img-"+p.id,hit=ls.get(ck,null);
  if(hit&&hit.length)return hit;
  if(!G.key||!G.cx||TRIED[p.id])return [];
  TRIED[p.id]=1;
  try{
    const u="https://www.googleapis.com/customsearch/v1?searchType=image&num=3&safe=active&key="+encodeURIComponent(G.key)+"&cx="+encodeURIComponent(G.cx)+"&q="+encodeURIComponent(p.name+" perfume");
    const j=await (await fetch(u)).json();
    const links=(j.items||[]).flatMap(i=>[i.link,i.image&&i.image.thumbnailLink]).filter(Boolean);
    if(links.length)ls.set(ck,links);
    return links;
  }catch(e){return []}
}
async function loadImages(){
  for(const p of products){
    if(OK[p.id])continue;
    const links=await imageLinks(p);
    const box=document.querySelector(`[data-art="${p.id}"]`);
    if(!links.length||!box||box.querySelector("img"))continue;
    let i=0;const img=new Image();
    img.alt=p.name;
    img.onload=()=>{OK[p.id]=img.src;const s=box.querySelector("svg");if(s)s.remove();box.prepend(img);renderCart()};
    img.onerror=()=>{if(++i<links.length)img.src=links[i]};
    img.src=links[0];
  }
}

/* ---------- Dibujo ---------- */
function bottle(p){
  const [a,b]=p.c,g="g"+p.id;
  return `<svg viewBox="0 0 100 150" aria-hidden="true"><defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
  <rect x="38" y="6" width="24" height="26" rx="2" fill="#c9a24b"/><rect x="42" y="30" width="16" height="10" fill="#8f7230"/>
  <rect x="12" y="40" width="76" height="102" rx="3" fill="url(#${g})"/><rect x="20" y="48" width="8" height="86" fill="#fff" opacity=".2"/>
  <rect x="34" y="78" width="46" height="28" fill="#fff" opacity=".9"/><rect x="40" y="86" width="34" height="3" fill="#333"/><rect x="40" y="94" width="22" height="3" fill="#777"/></svg>`;
}
function miniArt(p){return OK[p.id]?`<img src="${esc(OK[p.id])}" alt="">`:bottle(p)}

function renderTabs(){
  const cats=["Todos",...new Set(products.map(p=>p.cat))];
  $("tabs").innerHTML=cats.map(c=>`<button class="tab${c===cat?" on":""}" data-cat="${c}">${c}</button>`).join("");
}
function renderProducts(){
  let list=products.filter(p=>(cat==="Todos"||p.cat===cat)&&(p.name+" "+p.notes).toLowerCase().includes(term));
  if(sort==="asc")list=[...list].sort((x,y)=>x.price-y.price);
  if(sort==="desc")list=[...list].sort((x,y)=>y.price-x.price);
  $("grid").innerHTML=list.length?list.map(p=>`<article class="card">
    <div class="art" data-art="${p.id}">${OK[p.id]?`<img src="${esc(OK[p.id])}" alt="${esc(p.name)}">`:bottle(p)}<span class="tag">${p.cat}</span></div>
    <div class="body"><h3>${esc(p.name)}</h3><p class="notes">${esc(p.notes)}</p>
    <div class="row"><span class="price">${fmt(p.price)}</span><button class="add" data-add="${p.id}">Agregar</button></div></div></article>`).join("")
    :`<p class="empty">No se encontraron perfumes.</p>`;
  loadImages();
}
function renderCart(){
  $("items").innerHTML=cart.length?cart.map(i=>{const p=products.find(x=>x.id===i.id);return `<div class="item">
    <div class="mini">${miniArt(p)}</div>
    <div class="info"><p>${esc(p.name)}</p><small>${fmt(p.price*i.qty)}</small></div>
    <div class="qty"><button data-dec="${i.id}" aria-label="Quitar uno">−</button><span>${i.qty}</span><button data-inc="${i.id}" aria-label="Agregar uno">+</button></div>
    <button class="rm" data-rm="${i.id}" aria-label="Eliminar">×</button></div>`}).join("")
    :`<p class="empty">Tu carrito está vacío.</p>`;
  const n=cart.reduce((s,i)=>s+i.qty,0),t=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);
  $("count").textContent=n;$("total").textContent=fmt(t);
  ls.set("sbc-cart",cart);
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}
function setCart(o){$("panel").classList.toggle("open",o);$("overlay").classList.toggle("open",o)}
function change(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}

/* ---------- Panel de ajustes (escribe sbc-admin en el buscador) ---------- */
function closeAdmin(){$("adminPanel").classList.remove("open");$("aOverlay").classList.remove("open")}
function openAdmin(){
  $("adminPanel").innerHTML=`<div class="ph"><h2>Ajustes</h2><button id="aClose" aria-label="Cerrar">×</button></div><div class="items">
  <div class="sec">Precios</div>`+products.map(p=>`<label class="arow"><span>${esc(p.name)}</span><input type="number" min="1" data-pid="${p.id}" value="${p.price}"></label>`).join("")+
  `<div class="sec">Imágenes de Google</div>
  <label class="fld">API key<input id="gKey" value="${esc(G.key)}" autocomplete="off" autocapitalize="none"></label>
  <label class="fld">Search engine ID (cx)<input id="gCx" value="${esc(G.cx)}" autocomplete="off" autocapitalize="none"></label></div>
  <div class="pf"><button class="btn" id="aSave">Guardar</button><button class="btn ghost" id="aReset">Restablecer precios y buscar imágenes de nuevo</button></div>`;
  $("aClose").onclick=closeAdmin;
  $("aSave").onclick=()=>saveAdmin(false);
  $("aReset").onclick=()=>saveAdmin(true);
  $("adminPanel").classList.add("open");$("aOverlay").classList.add("open");
}
function saveAdmin(reset){
  const np={};
  if(!reset)$("adminPanel").querySelectorAll("input[data-pid]").forEach(i=>{const v=Math.round(+i.value),p=products.find(x=>x.id===+i.dataset.pid);if(p&&v>0&&v!==p.base)np[p.id]=v});
  ls.set("sbc-prices",np);
  G={key:$("gKey").value.trim(),cx:$("gCx").value.trim()};ls.set("sbc-google",G);
  products.forEach(p=>{try{localStorage.removeItem("sbc-img-"+p.id)}catch(e){}});
  location.reload();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const D=t.dataset;
  if(D.cat){cat=D.cat;renderTabs();renderProducts()}
  else if(D.add){const id=+D.add,i=cart.find(x=>x.id===id);i?i.qty++:cart.push({id,qty:1});renderCart();toast("Agregado al carrito")}
  else if(D.inc)change(+D.inc,1);
  else if(D.dec)change(+D.dec,-1);
  else if(D.rm){cart=cart.filter(x=>x.id!==+D.rm);renderCart()}
});
$("q").addEventListener("input",e=>{const v=e.target.value.trim();if(v===ADMIN_CODE){e.target.value="";term="";renderProducts();openAdmin();return}term=v.toLowerCase();renderProducts()});
$("sort").addEventListener("change",e=>{sort=e.target.value;renderProducts()});
$("openCart").onclick=()=>setCart(true);
$("closeCart").onclick=$("overlay").onclick=()=>setCart(false);
$("aOverlay").onclick=closeAdmin;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){setCart(false);closeAdmin()}});
$("checkout").onclick=()=>{
  if(!cart.length){toast("Tu carrito está vacío");return}
  const t=cart.reduce((s,i)=>s+products.find(p=>p.id===i.id).price*i.qty,0);
  cart=[];renderCart();setCart(false);toast("Gracias por tu compra. Total: "+fmt(t));
};
renderTabs();renderProducts();renderCart();
</script>
</body>
</html>
